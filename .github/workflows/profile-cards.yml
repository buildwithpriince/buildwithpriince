name: Refresh profile cards

on:
  schedule:
    - cron: "17 1 * * *"      # daily
  workflow_dispatch:
  push:
    paths: ["scripts/**", "fonts/**", "assets/**"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools pillow numpy

      # If your repo already has a step that writes data/contributions.json, keep that
      # one and delete this. Add a PROFILE_TOKEN secret (PAT, read:user) to count private work.
      - name: Fetch contributions
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: buildwithpriince
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, tiles, chart, repos, graph)
        run: python scripts/render_readme_cards.py

      - name: Commit data and cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/ fonts/.subset
          git diff --cached --quiet || git commit -m "chore: refresh cards"
          git push
